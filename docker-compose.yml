version: "3.9"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: gridsense_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gridsense
      POSTGRES_PASSWORD: gridsense_pass
      POSTGRES_DB: gridsense
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridsense -d gridsense"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
